<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/quizn-design-system-019dd1f4-2c70-7609-916f-874d459447f7/colors_and_type.css">
  <link rel="stylesheet" href="../_ds/quizn-design-system-019dd1f4-2c70-7609-916f-874d459447f7/fonts/fontello/css/fontello-codes.css">
  <link rel="stylesheet" href="../_ds/quizn-design-system-019dd1f4-2c70-7609-916f-874d459447f7/fonts/fontello/css/fontello.css">
  <script src="../_ds/quizn-design-system-019dd1f4-2c70-7609-916f-874d459447f7/_ds_bundle.js"></script>
  <style>
    a { color: var(--main-color); text-decoration: none; }
    a:hover { color: var(--btn-hover-color); text-decoration: underline; }
    @keyframes qnFloat { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
    .qn-field:focus-within .qn-fico { color: var(--main-color); }
    .qn-field:focus-within { border-color: var(--main-color) !important; background:#fff !important; box-shadow: 0 0 0 3px var(--bg-light-color); }
    .qn-social:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(0,0,0,0.25); }
    .qn-primary:hover { background: var(--btn-hover-color) !important; }
  </style>
</helmet>

<div style="min-height:100vh; background:#fff; font-family:var(--font-kr); display:flex; justify-content:center;">
  <div data-screen-label="로그인 · 모바일" style="width:100%; max-width:440px; min-height:100vh; background:#fff; display:flex; flex-direction:column;">

    <!-- hero -->
    <div style="position:relative; flex:none; background:linear-gradient(160deg,#ffb37a 0%, #ff8533 60%, #ff6800 100%); padding:52px 26px 0; overflow:hidden;">
      <div style="position:absolute; width:170px; height:170px; border-radius:50%; background:rgba(255,255,255,0.15); top:-40px; right:-44px;"></div>
      <div style="position:relative; text-align:center;">
        <div style="font-family:var(--font-kr); font-size:26px; font-weight:900; letter-spacing:-1px; color:#fff;">방탈출<span style="color:#ffe0c2;">N</span></div>
        <div style="margin-top:10px; font-family:var(--font-kr); font-size:20px; font-weight:700; line-height:1.4; color:#fff; letter-spacing:-0.3px;">다시 오셨네요!<br>오늘은 어떤 방을 만들어볼까요?</div>
      </div>
      <img src="../uploads/character01/play_loading_bg.png" alt="방탈출N 캐릭터들" style="display:block; width:78%; margin:6px auto -4px; filter:drop-shadow(0 10px 14px rgba(180,60,0,0.3)); animation:qnFloat 6s ease-in-out infinite;">
    </div>

    <!-- form -->
    <div style="flex:1; display:flex; flex-direction:column; padding:22px 24px 28px;">
      <div class="qn-field" style="display:flex; align-items:center; gap:10px; padding:0 15px; height:48px; border:1.5px solid var(--border); border-radius:12px; background:#fafafa; transition:all .18s ease;">
        <i class="icon-mail qn-fico" style="font-size:16px; color:var(--fg-mute); transition:color .18s ease;"></i>
        <input type="email" placeholder="이메일" style="flex:1; border:none; background:transparent; outline:none; font-family:var(--font-kr); font-size:15px; color:var(--fg);">
      </div>
      <div class="qn-field" style="display:flex; align-items:center; gap:10px; padding:0 15px; height:48px; border:1.5px solid var(--border); border-radius:12px; background:#fafafa; margin-top:10px; transition:all .18s ease;">
        <i class="icon-lock-filled qn-fico" style="font-size:15px; color:var(--fg-mute); transition:color .18s ease;"></i>
        <input type="{{ pwType }}" placeholder="비밀번호" style="flex:1; border:none; background:transparent; outline:none; font-family:var(--font-kr); font-size:15px; color:var(--fg);">
        <i class="{{ pwIcon }}" onClick="{{ togglePw }}" style="font-size:16px; color:var(--fg-mute); cursor:pointer;"></i>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:14px;">
        <div style="display:flex; gap:14px;">
          <label class="check" style="font-size:12.5px;"><input type="checkbox" checked><span class="box"></span><span>아이디 저장</span></label>
          <label class="check" style="font-size:12.5px;"><input type="checkbox"><span class="box"></span><span>자동 로그인</span></label>
        </div>
        <a href="비밀번호 찾기 - 모바일.dc.html" style="font-size:12.5px; font-weight:500;">비밀번호 찾기</a>
      </div>

      <button class="qn-primary" style="width:100%; margin-top:16px; height:50px; border:none; border-radius:14px; background:var(--main-color); color:#fff; font-family:var(--font-kr); font-size:16px; font-weight:700; cursor:pointer; transition:all .2s ease;">로그인</button>

      <div style="display:flex; align-items:center; gap:12px; margin:16px 0 14px;">
        <span style="flex:1; height:1px; background:var(--border);"></span>
        <span style="font-size:11.5px; color:var(--fg-mute); font-family:var(--font-small);">간편 로그인</span>
        <span style="flex:1; height:1px; background:var(--border);"></span>
      </div>

      <button class="qn-social" style="width:100%; display:flex; align-items:center; justify-content:center; gap:9px; height:48px; border:none; border-radius:14px; background:#FEE500; color:#191600; font-family:var(--font-kr); font-size:14.5px; font-weight:600; cursor:pointer; transition:all .2s ease;"><i class="icon-speech-bubble" style="font-size:15px;"></i> 카카오로 시작하기</button>
      <button class="qn-social" style="width:100%; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:9px; height:48px; border:none; border-radius:14px; background:#03C75A; color:#fff; font-family:var(--font-kr); font-size:14.5px; font-weight:600; cursor:pointer; transition:all .2s ease;"><span style="font-family:var(--font-en); font-weight:800; font-size:17px;">N</span> 네이버로 시작하기</button>
      <button class="qn-social" style="width:100%; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:9px; height:48px; border:1.5px solid var(--border); border-radius:14px; background:#fff; color:var(--fg); font-family:var(--font-kr); font-size:14.5px; font-weight:600; cursor:pointer; transition:all .2s ease;"><span style="font-family:var(--font-en); font-weight:800; font-size:17px; color:#4285F4;">G</span> 구글로 시작하기</button>

      <div style="margin-top:auto; padding-top:18px; text-align:center; font-family:var(--font-small); font-size:12.5px; color:var(--fg-sub);">아직 회원이 아니신가요? <a href="회원가입 - 모바일.dc.html" style="font-weight:700;">회원가입</a></div>
      <p style="margin:8px 0 0; text-align:center; font-family:var(--font-small); font-size:10px; font-weight:300; line-height:1.55; color:var(--fg-mute);">로그인 시 <a href="#" style="font-weight:500;">이용약관</a> 및 <a href="#" style="font-weight:500;">개인정보처리방침</a>에 동의합니다.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { showPw: false };
  renderVals() {
    const showPw = this.state.showPw;
    return {
      pwType: showPw ? 'text' : 'password',
      pwIcon: showPw ? 'icon-eye' : 'icon-eye-none',
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
    };
  }
}
</script>
</body>
</html>
